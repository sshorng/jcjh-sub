<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>domain-* 單元測試</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: #f8fafc; }
    h1 { font-size: 1.2rem; }
    .pass { color: #15803d; }
    .fail { color: #b91c1c; font-weight: 700; }
    pre { background: #fff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; max-height: 50vh; overflow: auto; }
  </style>
</head>
<body>
  <h1>domain-match / domain-school-swap / domain-schedule / domain-class-away 單元測試</h1>
  <p id="summary"></p>
  <pre id="log"></pre>
  <script src="../domain-match.js"></script>
  <script src="../domain-school-swap.js"></script>
  <script src="../domain-schedule.js"></script>
  <script src="../domain-triangle.js"></script>
  <script src="../domain-class-away.js"></script>
  <script src="../domain-activity-cover.js"></script>
  <script src="../domain-billing.js"></script>
  <script src="../fee-utils.js"></script>
  <script>
    (function () {
      var log = [];
      var passed = 0;
      var failed = 0;

      function assert(name, cond, detail) {
        if (cond) {
          passed++;
          log.push('✓ ' + name);
        } else {
          failed++;
          log.push('✗ ' + name + (detail ? ' — ' + detail : ''));
        }
      }

      // ── parseSubjects ──
      var ps = window.DomainMatch.parseSubjects;
      assert('parseSubjects 頓號', JSON.stringify(ps('國文、輔導')) === JSON.stringify(['國文', '輔導']));
      assert('parseSubjects 逗號', JSON.stringify(ps('國文,歷史')) === JSON.stringify(['國文', '歷史']));
      assert('parseSubjects 分號', JSON.stringify(ps('國文；歷史')) === JSON.stringify(['國文', '歷史']));
      assert('parseSubjects 空', ps('').length === 0);

      // ── rankSubstitutionCandidates ──
      var teachers = [
        { email: 'a@x', name: '甲', subject: '國文' },
        { email: 'b@x', name: '乙', subject: '國文、輔導' },
        { email: 'c@x', name: '丙', subject: '數學' },
        { email: 'd@x', name: '丁', subject: '輔導' },
        { email: 'e@x', name: '戊', subject: '國文' },
        { email: 'f@x', name: '己', subject: '輔導' },
        { email: 'g@x', name: '庚', subject: '國文' }
      ];
      var schedules = [
        { teacherEmail: 'a@x', dayOfWeek: 1, period: 2, className: '701', subject: '國文' },
        { teacherEmail: 'b@x', dayOfWeek: 1, period: 3, className: '702', subject: '輔導' },
        { teacherEmail: 'd@x', dayOfWeek: 2, period: 1, className: '701', subject: '輔導' },
        { teacherEmail: 'e@x', dayOfWeek: 2, period: 3, className: '901', subject: '輔導' },
        { teacherEmail: 'g@x', dayOfWeek: 2, period: 4, className: '901', subject: '生物' }
      ];
      // 簡易 getScheduleForDate：只看基礎課表，不管異動
      function mockGet(email, dateStr, period, day) {
        var hit = schedules.find(function (s) {
          return s.teacherEmail === email && parseInt(s.dayOfWeek) === parseInt(day) && parseInt(s.period) === parseInt(period);
        });
        return hit || null;
      }
      // 請假：甲 週一第1節「輔導」—— 需求科應為輔導（格子是標準科）
      var ranked = window.DomainMatch.rankSubstitutionCandidates({
        teachers: teachers,
        allSchedules: schedules,
        leaveEmail: 'a@x',
        dateStr: '2026-07-13',
        targetDay: 1,
        targetPeriod: 1,
        myCourse: '輔導',
        myDomain: '國文、輔導',
        myClass: '701',
        getScheduleForDate: mockGet
      });
      var d = ranked.find(function (t) { return t.email === 'd@x'; });
      var c = ranked.find(function (t) { return t.email === 'c@x'; });
      var b = ranked.find(function (t) { return t.email === 'b@x'; });
      var e = ranked.find(function (t) { return t.email === 'e@x'; });
      var f = ranked.find(function (t) { return t.email === 'f@x'; });
      assert('輔導代課：丁同科', d && d.isSameSubject === true);
      assert('輔導代課：丙不同科', c && c.isSameSubject === false);
      assert('輔導代課：乙同科（名單含輔導）', b && b.isSameSubject === true);
      // 戊（e@x）名單科目「國文」直接命中 leaveDomains[0]='輔導'... 不對；但 leaveDomains 含「國文」→ 戊命中國文，isPrimarySubject=true
      assert('輔導代課：戊同科（命中 leaveDomains 中的國文）', e && e.isSameSubject === true);
      assert('輔導代課：己主要科同科', f && f.isSameSubject === true && f.isPrimarySubject === true);
      // 戊命中 leaveDomains 中「國文」rank=3（inRoster 且 isRosterPrimary），己命中「輔導」rank=3，兩者平手，排序由 todayPeriodCount 決定
      assert('主要科目優先：己與戊皆同科主科，排序由負荷決定', f && e && f.isSameSubject && e.isSameSubject);
      assert('請假人自己不在名單', !ranked.find(function (t) { return t.email === 'a@x'; }));

      // 走讀：leaveDomains=['國文','輔導']；甲（國文）、丁（輔導）皆命中，都算同科
      var ranked2 = window.DomainMatch.rankSubstitutionCandidates({
        teachers: teachers,
        allSchedules: schedules,
        leaveEmail: 'b@x',
        dateStr: '2026-07-13',
        targetDay: 1,
        targetPeriod: 1,
        myCourse: '走讀',
        myDomain: '國文、輔導',
        myClass: '702',
        getScheduleForDate: mockGet
      });
      var a2 = ranked2.find(function (t) { return t.email === 'a@x'; });
      var d2 = ranked2.find(function (t) { return t.email === 'd@x'; });
      assert('走讀：甲同科（命中國文）', a2 && a2.isSameSubject === true, a2 && 'demand=' + a2.demandDomain);
      // 多科邏輯：leaveDomains 含「輔導」，丁（輔導）也算同科
      assert('走讀：丁同科（leaveDomains 含輔導）', d2 && d2.isSameSubject === true, d2 && 'demand=' + d2.demandDomain);


      // 課表才有的第二科，也應可成為本堂需求科
      var ranked3 = window.DomainMatch.rankSubstitutionCandidates({
        teachers: teachers,
        allSchedules: schedules,
        leaveEmail: 'a@x',
        dateStr: '2026-07-13',
        targetDay: 1,
        targetPeriod: 1,
        myCourse: '生物',
        myDomain: '國文',
        myClass: '701',
        getScheduleForDate: mockGet
      });
      var g3 = ranked3.find(function (t) { return t.email === 'g@x'; });
      assert('生物代課：課表第二科可推導需求科', g3 && g3.isSameSubject === true && g3.demandDomain === '生物');

      // 曾瀅芮案：8英資A 專題探究（英語資優班），請假教師兼任「英語資優、英語」，專題探究不吃掉需求科，英語老師與英語資優老師皆為同科，特教老師不為同科
      var teachersWithEnglish = teachers.concat([
        { email: 'yingrui@x', name: '曾瀅芮', subject: '英語資優、英語' },
        { email: 'eng@x', name: '英師', subject: '英語' },
        { email: 'eng-gift@x', name: '英資師', subject: '英語資優' },
        { email: 'math2@x', name: '數師', subject: '數學' },
        { email: 'special@x', name: '特師', subject: '特教' }
      ]);
      var schedulesWithEnglish = schedules.concat([
        { teacherEmail: 'yingrui@x', dayOfWeek: 3, period: 0, className: '8英資A', subject: '專題探究' }
      ]);
      var rankedYingRui = window.DomainMatch.rankSubstitutionCandidates({
        teachers: teachersWithEnglish,
        allSchedules: schedulesWithEnglish,
        leaveEmail: 'yingrui@x',
        dateStr: '2026-09-02',
        targetDay: 3,
        targetPeriod: 0,
        myCourse: '專題探究',
        myDomain: '英語資優、英語',
        myClass: '8英資A',
        getScheduleForDate: mockGet
      });
      var engCand = rankedYingRui.find(function (t) { return t.email === 'eng@x'; });
      var engGiftCand = rankedYingRui.find(function (t) { return t.email === 'eng-gift@x'; });
      var mathCand = rankedYingRui.find(function (t) { return t.email === 'math2@x'; });
      var specialCand = rankedYingRui.find(function (t) { return t.email === 'special@x'; });
      assert('曾瀅芮案：專題探究回退英語資優需求科', engGiftCand && engGiftCand.demandDomain === '英語資優');
      assert('曾瀅芮案：英語資優老師同科', engGiftCand && engGiftCand.isSameSubject === true);
      assert('曾瀅芮案：英語老師同科（多科目精確比對）', engCand && engCand.isSameSubject === true);
      assert('曾瀅芮案：特教老師絕不同科', specialCand && specialCand.isSameSubject === false);
      assert('曾瀅芮案：數學老師不同科', mathCand && mathCand.isSameSubject === false);
      assert('曾瀅芮案：英語資優排序優先於一般英語', engGiftCand && engCand && rankedYingRui.indexOf(engGiftCand) < rankedYingRui.indexOf(engCand));

      // ── schedule index + resolve ──
      var idx = window.DomainSchedule.buildScheduleIndex(schedules);
      assert('index 有 a|1|2', !!(idx.byTeacherSlot['a@x|1|2'] && idx.byTeacherSlot['a@x|1|2'].length));
      var datedSchedules = [
        { teacherEmail: 'v@x', dayOfWeek: 1, period: 2, className: '701', subject: '國文', activeFrom: '2026-07-20', activeTo: '2026-07-31' },
        { teacherEmail: 'v@x', dayOfWeek: 1, period: 2, className: '701', subject: '數學', activeFrom: '2026-08-01', activeTo: '' },
        { teacherEmail: 'legacy@x', dayOfWeek: 1, period: 2, className: '702', subject: '國文' }
      ];
      assert('啟用日期起日含邊界', window.DomainSchedule.isActiveOnDate(datedSchedules[0], '2026-07-20') === true);
      assert('啟用日期迄日含邊界', window.DomainSchedule.isActiveOnDate(datedSchedules[0], '2026-07-31') === true);
      assert('啟用日期範圍外不生效', window.DomainSchedule.isActiveOnDate(datedSchedules[0], '2026-08-01') === false);
      assert('舊資料空白代表整學期', window.DomainSchedule.isActiveOnDate(datedSchedules[2], '2026-12-31') === true);
      assert('啟用版本日期解析', window.DomainSchedule.getCandidates(
        window.DomainSchedule.buildScheduleIndex(datedSchedules), 'v@x', 1, 2, datedSchedules, '2026-08-03'
      )[0].subject === '數學');
      assert('啟用區間不重疊', window.DomainSchedule.scheduleRangesOverlap(
        datedSchedules[0], datedSchedules[1]
      ) === false);
      var base = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'a@x',
        dateStr: '2026-07-13',
        period: 2,
        dayOfWeek: 1,
        allSchedules: schedules,
        scheduleIndex: idx,
        periodSubs: [],
        allSubs: [],
        helpers: {
          getTeacherNameByEmail: function () { return 'X'; },
          getTeacherSubjectByEmail: function () { return ''; },
          formatDateMMDD: function (d) { return d; },
          isSingleWeek: function () { return true; },
          isClassAway: function () { return false; }
        }
      });
      assert('resolve 基礎課', base && base.subject === '國文' && base.className === '701');

      // ── 全校日期節次對調 ──
      var swapRows = [
        {
          對調ID: 'swap-1', 事件名稱: '校慶補課', 日期A: '2026-07-13', 星期A: 1, 節次A: 2,
          日期B: '2026-07-14', 星期B: 2, 節次B: 3, 啟用: true
        },
        {
          對調ID: 'swap-disabled', 事件名稱: '停用事件', 日期A: '2026-07-15', 星期A: 3, 節次A: 1,
          日期B: '2026-07-16', 星期B: 4, 節次B: 1, 啟用: false
        }
      ];
      var swapIndex = window.DomainSchoolSwap.buildIndex(swapRows);
      var swapA = window.DomainSchoolSwap.resolveSlot(swapIndex, '2026-07-13', 1, 2);
      var swapB = window.DomainSchoolSwap.resolveSlot(swapIndex, '2026-07-14', 2, 3);
      var swapOff = window.DomainSchoolSwap.resolveSlot(swapIndex, '2026-07-15', 3, 1);
      assert('對調 A 端解析來源 B 端', swapA.dayOfWeek === 2 && swapA.period === 3 && swapA.endpoint === 'A');
      assert('對調 B 端解析來源 A 端', swapB.dayOfWeek === 1 && swapB.period === 2 && swapB.endpoint === 'B');
      assert('停用對調不套用', swapOff.dayOfWeek === 3 && swapOff.period === 1 && !swapOff.row);
      assert('對調標籤含事件名稱', window.DomainSchoolSwap.label(swapA.row).indexOf('校慶補課') >= 0);

      var swappedSchedules = schedules.concat([
        { teacherEmail: 'a@x', dayOfWeek: 2, period: 3, className: '702', subject: '數學' }
      ]);
      var swappedCell = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'a@x',
        dateStr: '2026-07-13',
        period: 2,
        dayOfWeek: 1,
        scheduleDayOfWeek: swapA.dayOfWeek,
        schedulePeriod: swapA.period,
        allSchedules: swappedSchedules,
        scheduleIndex: window.DomainSchedule.buildScheduleIndex(swappedSchedules),
        periodSubs: [],
        allSubs: [],
        helpers: {
          getTeacherNameByEmail: function () { return 'X'; },
          getTeacherSubjectByEmail: function () { return ''; },
          formatDateMMDD: function (d) { return d; },
          isSingleWeek: function () { return true; },
          isClassAway: function () { return false; }
        }
      });
      assert('課表對調使用來源星期／節次', swappedCell && swappedCell.className === '702' && swappedCell.subject === '數學');

      // 代課出：a 的課由 d 代
      var subRec = {
        originalTeacherEmail: 'a@x',
        actualTeacherEmail: 'd@x',
        type: 'substitution',
        requestId: 'r1',
        subject: '國文',
        className: '701',
        date: '2026-07-13',
        period: 2,
        subFee: '自費代課'
      };
      var outCell = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'a@x',
        dateStr: '2026-07-13',
        period: 2,
        dayOfWeek: 1,
        allSchedules: schedules,
        scheduleIndex: idx,
        periodSubs: [subRec],
        allSubs: [subRec],
        helpers: {
          getTeacherNameByEmail: function (e) { return e === 'd@x' ? '丁' : '甲'; },
          getTeacherSubjectByEmail: function () { return ''; },
          formatDateMMDD: function (d) { return d; },
          isSingleWeek: function () { return true; },
          isClassAway: function () { return false; }
        }
      });
      assert('代課調出 isSubstituted', outCell && outCell.isSubstituted === true);

      var inCell = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'd@x',
        dateStr: '2026-07-13',
        period: 2,
        dayOfWeek: 1,
        allSchedules: schedules,
        scheduleIndex: idx,
        periodSubs: [subRec],
        allSubs: [subRec],
        helpers: {
          getTeacherNameByEmail: function (e) { return e === 'a@x' ? '甲' : '丁'; },
          getTeacherSubjectByEmail: function () { return ''; },
          formatDateMMDD: function (d) { return d; },
          isSingleWeek: function () { return true; },
          isClassAway: function () { return false; }
        }
      });
      assert('代課調入 isSubstitutionDuty', inCell && inCell.isSubstitutionDuty === true);
      assert('代課調入班科', inCell && inCell.className === '701' && inCell.subject === '國文');

      // 對調：課程留在原來的位置，只交換授課教師
      var exA = {
        id: 'ex1', requestId: 'rex', type: 'exchange',
        originalTeacherEmail: 'a@x', actualTeacherEmail: 'd@x',
         date: '2026-07-13', period: 2, className: '701', subject: '國文', subFee: '無'
      };
      var exB = {
        id: 'ex2', requestId: 'rex', type: 'exchange',
        originalTeacherEmail: 'd@x', actualTeacherEmail: 'a@x',
         date: '2026-07-14', period: 3, className: '702', subject: '輔導', subFee: '無'
      };
      var schedulesEx = schedules.concat([
        { teacherEmail: 'd@x', dayOfWeek: 2, period: 3, className: '702', subject: '輔導' }
      ]);
      var idxEx = window.DomainSchedule.buildScheduleIndex(schedulesEx);
      var helpersEx = {
        getTeacherNameByEmail: function (e) { return e; },
        getTeacherSubjectByEmail: function () { return ''; },
        formatDateMMDD: function (d) { return String(d).slice(5); },
        isSingleWeek: function () { return true; },
        isClassAway: function () { return false; }
      };
      var aOut = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'a@x', dateStr: '2026-07-13', period: 2, dayOfWeek: 1,
        allSchedules: schedulesEx, scheduleIndex: idxEx,
        periodSubs: [exA], allSubs: [exA, exB], helpers: helpersEx
      });
       // 調出：主標仍是本人課程（國文），副標才寫調至對方
      assert('對調調出主標仍是本課', aOut && aOut.isSubstituted && aOut.subject === '國文' && aOut.className === '701',
        aOut && (aOut.className + '/' + aOut.subject));
      assert('對調調出副標有對方時間', aOut && aOut.subText && aOut.subText.indexOf('調至') >= 0);
      var aIn = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'a@x', dateStr: '2026-07-14', period: 3, dayOfWeek: 2,
        allSchedules: schedulesEx, scheduleIndex: idxEx,
        periodSubs: [exB], allSubs: [exA, exB], helpers: helpersEx
      });
       // 調入：主標＝目標位置原本的課程（B 原課）
      helpersEx.getTeacherSubjectByEmail = function (e) {
        if (e === 'a@x') return '國文';
        if (e === 'd@x') return '輔導';
        return '';
      };
      aIn = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'a@x', dateStr: '2026-07-14', period: 3, dayOfWeek: 2,
        allSchedules: schedulesEx, scheduleIndex: idxEx,
        periodSubs: [exB], allSubs: [exA, exB], helpers: helpersEx
      });
        // 對調調入：主標＝原位置課程
       assert('對調調入主標＝原位置課(702/輔導)', aIn && aIn.isSubstitutionDuty && aIn.subject === '輔導' && aIn.className === '702',
         aIn && (aIn.className + '/' + aIn.subject));

        // A理化 B國文 C數學：AB 後 BC — 各異動格仍顯示原位置課程
      var schedulesABC = [
        { teacherEmail: 'a@x', dayOfWeek: 1, period: 1, className: '801', subject: '理化' },
        { teacherEmail: 'b@x', dayOfWeek: 1, period: 2, className: '802', subject: '國文' },
        { teacherEmail: 'c@x', dayOfWeek: 1, period: 3, className: '803', subject: '數學' }
      ];
      var idxABC = window.DomainSchedule.buildScheduleIndex(schedulesABC);
       var ab1 = { id: 'ab1', requestId: 'ab', type: 'exchange', originalTeacherEmail: 'a@x', actualTeacherEmail: 'b@x',
         date: '2026-07-13', period: 1, className: '801', subject: '理化', subFee: '無' };
       var ab2 = { id: 'ab2', requestId: 'ab', type: 'exchange', originalTeacherEmail: 'b@x', actualTeacherEmail: 'a@x',
         date: '2026-07-13', period: 2, className: '802', subject: '國文', subFee: '無' };
       // BC：B 再調，仍保留原位置課程
       var bc1 = { id: 'bc1', requestId: 'bc', type: 'exchange', originalTeacherEmail: 'b@x', actualTeacherEmail: 'c@x',
         date: '2026-07-13', period: 1, className: '801', subject: '理化', subFee: '無' };
       var bc2 = { id: 'bc2', requestId: 'bc', type: 'exchange', originalTeacherEmail: 'c@x', actualTeacherEmail: 'b@x',
         date: '2026-07-13', period: 3, className: '803', subject: '數學', subFee: '無' };
      var hABC = {
        getTeacherNameByEmail: function (e) { return e; },
        getTeacherSubjectByEmail: function (e) {
          if (e === 'a@x') return '理化';
          if (e === 'b@x') return '國文';
          if (e === 'c@x') return '數學';
          return '';
        },
        formatDateMMDD: function (d) { return d; },
        isSingleWeek: function () { return true; },
        isClassAway: function () { return false; }
      };
      var bP1 = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'b@x', dateStr: '2026-07-13', period: 1, dayOfWeek: 1,
        allSchedules: schedulesABC, scheduleIndex: idxABC,
        periodSubs: [ab1, bc1], allSubs: [ab1, ab2, bc1, bc2], helpers: hABC
      });
        assert('B 再調出主標仍是原位置理化', bP1 && bP1.isSubstituted && bP1.subject === '理化' && bP1.className === '801',
         bP1 && (bP1.className + '/' + bP1.subject + '/' + (bP1.isSubstituted ? 'out' : '')));
      var cP1 = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'c@x', dateStr: '2026-07-13', period: 1, dayOfWeek: 1,
        allSchedules: schedulesABC, scheduleIndex: idxABC,
        periodSubs: [ab1, bc1], allSubs: [ab1, ab2, bc1, bc2], helpers: hABC
      });
       assert('C 調入主標＝原位置課(801/理化)', cP1 && cP1.isSubstitutionDuty && cP1.subject === '理化' && cP1.className === '801',
        cP1 && (cP1.className + '/' + cP1.subject));
      var bP3 = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'b@x', dateStr: '2026-07-13', period: 3, dayOfWeek: 1,
        allSchedules: schedulesABC, scheduleIndex: idxABC,
        periodSubs: [bc2], allSubs: [ab1, ab2, bc1, bc2], helpers: hABC
      });
       assert('B 調入主標＝原位置課(803/數學)', bP3 && bP3.isSubstitutionDuty && bP3.subject === '數學' && bP3.className === '803',
        bP3 && (bP3.className + '/' + bP3.subject));
      var bP2 = window.DomainSchedule.resolveApprovedSchedule({
        teacherEmail: 'b@x', dateStr: '2026-07-13', period: 2, dayOfWeek: 1,

          teacherEmail: 'a@x', dateStr: '2026-07-13', period: 2,
          pendingRequests: [], pendingIndex: pIdx,
          getWeekDayText: function () { return '一'; }
        });
        assert('pending 索引疊加代出', ov && ov.isPending && ov.pendingType === 'substitution_out');
         var combinedIdx = window.DomainSchedule.buildPendingIndex([{
           type: 'substitution', requesterEmail: 'a@x', targetTeacherEmail: 'b@x', targetTeacherName: '乙',
           requestDate: '2026-07-13', requestPeriod: 2, requesterName: '甲',
           className: '701、702', subject: '國文', specialFlow: 'combined_return'
         }]);
        var combinedPending = window.DomainSchedule.applyPendingOverlay({
          cell: { className: '701、702', subject: '國文' },
          teacherEmail: 'a@x', dateStr: '2026-07-13', period: 2,
          pendingRequests: [], pendingIndex: combinedIdx,
          getWeekDayText: function () { return '一'; }
         });
          assert('pending 合班回原班索引', combinedPending
            && combinedPending.pendingType === 'combined_return_out'
            && combinedPending.isSubstituted === true);
         var combinedPendingIn = window.DomainSchedule.applyPendingOverlay({
           cell: { className: '702', subject: '英文' },
           teacherEmail: 'b@x', dateStr: '2026-07-13', period: 2,
           pendingRequests: [], pendingIndex: combinedIdx,
           getWeekDayText: function () { return '一'; }
         });
         assert('pending 合班回原班代課方即使原本有課也疊加', combinedPendingIn
           && combinedPendingIn.pendingType === 'combined_return_in'
           && combinedPendingIn.className === '701、702');
         var combinedApproved = window.DomainSchedule.resolveApprovedSchedule({
           teacherEmail: 'b@x', dateStr: '2026-07-13', period: 2, dayOfWeek: 1,
           allSchedules: [
             { teacherEmail: 'a@x', dayOfWeek: 1, period: 2, className: '701、702', subject: '國文', attr: '基本' },
             { teacherEmail: 'b@x', dayOfWeek: 1, period: 2, className: '702', subject: '英文', attr: '基本' }
           ],
           periodSubs: [{
             originalTeacherEmail: 'a@x', actualTeacherEmail: 'b@x', date: '2026-07-13', period: 2,
             type: 'substitution', className: '701、702', subject: '國文', specialFlow: 'combined_return'
           }],
           allSubs: [{
             originalTeacherEmail: 'a@x', actualTeacherEmail: 'b@x', date: '2026-07-13', period: 2,
             type: 'substitution', className: '701、702', subject: '國文', specialFlow: 'combined_return'
           }],
           helpers: { getTeacherNameByEmail: function (e) { return e; }, isClassAway: function () { return false; }, isSingleWeek: function () { return true; } }
         });
          assert('核准合班回原班由其他併班教師代課', combinedApproved
            && combinedApproved.isSubstitutionDuty === true
            && combinedApproved.isCombinedReturn === true
            && combinedApproved.className === '701、702'
            && combinedApproved.subRecord.actualTeacherEmail === 'b@x');
          var combinedApprovedOut = window.DomainSchedule.resolveApprovedSchedule({
            teacherEmail: 'a@x', dateStr: '2026-07-13', period: 2, dayOfWeek: 1,
            allSchedules: [
              { teacherEmail: 'a@x', dayOfWeek: 1, period: 2, className: '701、702', subject: '國文', attr: '基本' },
              { teacherEmail: 'b@x', dayOfWeek: 1, period: 2, className: '702', subject: '英文', attr: '基本' }
            ],
            periodSubs: [{
              originalTeacherEmail: 'a@x', actualTeacherEmail: 'b@x', date: '2026-07-13', period: 2,
              type: 'substitution', className: '701、702', subject: '國文', specialFlow: 'combined_return'
            }],
            allSubs: [],
            helpers: { getTeacherNameByEmail: function (e) { return e; }, isClassAway: function () { return false; }, isSingleWeek: function () { return true; } }
          });
          assert('核准合班回原班請假方課程劃線狀態', combinedApprovedOut
            && combinedApprovedOut.isSubstituted === true
            && combinedApprovedOut.isCombinedReturn === true);
      }

      // ── 空堂排班 ──
      if (window.DomainActivityCover) {
        var DAC = window.DomainActivityCover;
        assert('空堂可排：null', DAC.isEmptySlotAssignable(null) === true);
        assert('空堂可排：巡堂', DAC.isEmptySlotAssignable({ isPatrol: true, attr: '巡堂' }) === true);
        assert('空堂可排：調開／被代', DAC.isEmptySlotAssignable({ isSubstituted: true, className: '701', subject: '國文' }) === true);
        assert('空堂不可：有班', DAC.isEmptySlotAssignable({ className: '701', subject: '國文' }) === false);
        assert('空堂不可：已代義務', DAC.isEmptySlotAssignable({ isSubstitutionDuty: true }) === false);
        assert('額度0需還節', DAC.quotaZeroNeedsRepay(0) === true);
        assert('額度0.5不足1需還節', DAC.quotaZeroNeedsRepay(0.5) === true);
        assert('額度1不需還節', DAC.quotaZeroNeedsRepay(1) === false);
        assert('釋出1節＝0.5', DAC.slotsToEarnQuota(1) === 0.5);
        assert('釋出3節＝1.5', DAC.slotsToEarnQuota(3) === 1.5);
        assert('餘額0.5不可扣', DAC.canSpendQuota(0.5) === false);
        assert('餘額1可扣', DAC.canSpendQuota(1) === true);
        var ep = DAC.buildEmptySlotPayload({
          date: '2026-07-23', period: 3, dayOfWeek: 4,
          teacherEmail: 't@x', teacherName: '測試',
          taskName: '段考巡堂', className: '', note: '',
          semesterId: 'S1', requestId: 'req_t', serial: 'SUB9999'
        });
        assert('payload 扣額度', ep.request['經費來源'] === '扣額度');
        assert('payload 不寄信', ep.skipNotify === true);
         assert('payload 同人', ep.request['申請人姓名'] === '測試'
           && ep.request['受邀人姓名'] === '測試'
           && ep.request['申請人Email'] === undefined
           && ep.request['受邀人Email'] === undefined);
        assert('payload 科目任務名', ep.request['科目'] === '段考巡堂');
        assert('payload 班級可空', ep.request['班級'] === '');
        assert('payload 事由', ep.request['請假事由'] === '空堂排班');
      }
      if (window.DomainSchedule && window.DomainSchedule.resolveApprovedSchedule) {
        var emptyCell = window.DomainSchedule.resolveApprovedSchedule({
          teacherEmail: 't@x',
          dateStr: '2026-07-23',
          period: 3,
          dayOfWeek: 4,
          allSchedules: [],
          periodSubs: [{
            originalTeacherEmail: 't@x',
            actualTeacherEmail: 't@x',
            type: 'substitution',
            reason: '空堂排班',
            subject: '段考巡堂',
            className: '',
            subFee: '扣額度',
            note: '[直接核准] [空堂排班]'
          }],
          allSubs: [],
          helpers: { getTeacherNameByEmail: function (e) { return e; }, isClassAway: function () { return false; }, isSingleWeek: function () { return true; } }
        });
        assert('課表顯示空堂任務', emptyCell && emptyCell.isEmptySlotAssign && emptyCell.subject === '段考巡堂');
      }

      // ── 媒合：外出班當空堂；僅活動互代往上排 ──
      if (window.DomainMatch && window.DomainMatch.isSlotFreeForMatch) {
         assert('空堂事件當空', window.DomainMatch.isSlotFreeForMatch({ className: '901', isClassAway: true }, {}) === true);
         assert('巡堂當空堂', window.DomainMatch.isSlotFreeForMatch({ attr: '巡堂' }, {}) === true);
         assert('一般有課不空', window.DomainMatch.isSlotFreeForMatch({ className: '701' }, {}) === false);
        assert('面板外出班當空', window.DomainMatch.isSlotFreeForMatch({ className: '701' }, { '701': true }) === true);
        var teachers2 = [
          { email: 'a@x', name: '甲', subject: '國文' },
          { email: 'b@x', name: '乙', subject: '數學' }
        ];
        function get2(em, d, p) {
          if (em === 'a@x' && p === 1) return { className: '901', isClassAway: true };
          if (em === 'b@x' && p === 1) return null;
          return { className: '701' };
        }
        var actRank = window.DomainMatch.rankSubstitutionCandidates({
          teachers: teachers2, allSchedules: [], leaveEmail: 'z@x', dateStr: '2026-07-13',
          targetDay: 1, targetPeriod: 1, myCourse: '國', myDomain: '數學', myClass: '701',
          getScheduleForDate: get2, awayClasses: [], activityMode: true, preferReleasedByAway: true
        });
        assert('活動互代釋出置頂', actRank[0] && actRank[0].email === 'a@x' && actRank[0].score >= 100);
        var normRank = window.DomainMatch.rankSubstitutionCandidates({
          teachers: teachers2, allSchedules: [], leaveEmail: 'z@x', dateStr: '2026-07-13',
          targetDay: 1, targetPeriod: 1, myCourse: '國', myDomain: '數學', myClass: '701',
          getScheduleForDate: get2, awayClasses: [], activityMode: false, preferReleasedByAway: false
        });
        assert('一般代課釋出不加100', normRank.find(function (t) { return t.email === 'a@x'; }).score < 100);
      }

      document.getElementById('summary').innerHTML =
        failed === 0
          ? '<span class="pass">全部通過 ' + passed + ' 項</span>'
          : '<span class="fail">失敗 ' + failed + ' / 通過 ' + passed + '</span>';
      document.getElementById('log').textContent = log.join('\n');
      document.title = (failed === 0 ? 'PASS' : 'FAIL') + ' — domain tests';
    })();
  </script>
</body>
